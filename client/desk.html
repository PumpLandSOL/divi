<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIVI — practice desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<nav class="topnav"><a class="brand" href="/">DIVI</a><div class="links"><a href="/">Home</a><a href="/trade">Trade</a><a href="/calendar">Calendar</a><a href="/desk" class="on">Practice</a><a href="/docs">Docs</a><a href="/contracts/DiviPerps.sol">Contract</a></div><button class="connect" id="connect">Connect</button></nav>
<div class="page"><div class="head"><h1>Same rules, <em>practice balances.</em></h1><p>10,000 practice USDG. Same fills, same maintenance, same dividends on declared ex-dates.</p></div>
<div class="fxbar"><div class="box">A1</div><div class="fx">fx</div><div class="formula">Fill the yellow cells, then press Open.</div></div>
<div class="sheetwrap"><div id="sheet"></div></div>
<div class="tabs"><span class="plus">+</span><a href="/">Board</a><a href="/trade">Trade</a><a href="/calendar">Calendar</a><a href="/desk" class="on">Practice</a><a href="/docs">Docs</a><span class="status" id="status"></span></div></div>
<script src="/sheet.js"></script><script src="/connect.js"></script>
<script>
(function(){
  const S=new Sheet(document.getElementById('sheet'),{cols:10,widths:[120,110,90,90,90,90,100,110,110,90]});
  let BOARD=[],A=null,form={sym:'AAPL',side:'long',lev:3,margin:1000};
  const who=()=>window.deskId();
  function inp(key,type){const i=document.createElement(type==='select'?'select':'input');if(type==='select'){i.innerHTML=BOARD.map(f=>'<option value="'+f.sym+'"'+(f.sym===form.sym?' selected':'')+'>'+f.sym+' · '+f.name+'</option>').join('')}else{i.type='number';i.value=form[key];i.min=key==='lev'?1:10;i.max=key==='lev'?10:undefined}i.onchange=()=>{form[key]=type==='select'?i.value:+i.value;draw()};return i}
  function btn(label,fn,cls){const b=document.createElement('button');b.className='cellbtn '+(cls||'');b.textContent=label;b.onclick=fn;return b}
  async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());if(r.error)toast(r.error,true);else{A=r.account;draw()}return r}
  function draw(){
    const f=BOARD.find(x=>x.sym===form.sym);if(!f||!A)return;
    const fill=f.mark*(1+(form.side==='long'?1:-1)*(f.confBps/2)/1e4),notional=form.margin*form.lev,qty=notional/fill,nx=f.div&&f.div.next;
    const R=[];

    R.push([{v:'Order',cls:'hd',span:10}]);
    R.push([{v:'Ticker',cls:'h'},{el:inp('sym','select'),cls:'edit',span:2},{v:'Side',cls:'h'},{el:btn(form.side==='long'?'LONG ▾':'long',()=>{form.side='long';draw()},form.side==='long'?'green':''),cls:'edit'},{el:btn(form.side==='short'?'SHORT ▾':'short',()=>{form.side='short';draw()},form.side==='short'?'red':''),cls:'edit'},{v:'Leverage',cls:'h'},{el:inp('lev'),cls:'edit'},{v:'Margin USDG',cls:'h'},{el:inp('margin'),cls:'edit'}]);
    R.push([{v:'Fill price',cls:'h'},{v:fmt(fill),cls:'r b',f:'=C_mark'+(form.side==='long'?'+':'−')+'conf/2',note:'mark '+fmt(f.mark)+' ± '+Math.round(f.confBps)+'bp, session '+f.session.toUpperCase()},{v:'Size',cls:'h'},{v:fmt(notional,0),cls:'r',f:'=margin×lev'},{v:'Shares',cls:'h'},{v:fmt(qty,4),cls:'r',f:'=size/fill'},{v:'Next dividend',cls:'h'},{v:nx?(form.side==='long'?'+':'−')+'$'+fmt(qty*nx.amount)+' on '+fmtDate(nx.ex):'—',cls:'r '+(nx?(form.side==='long'?'green':'red'):''),f:nx?'=shares×'+nx.amount:'',note:nx?(nx.confirmed?'declared':'projected'):''},{el:btn('Open',()=>post('/api/desk/open',{w:who(),sym:form.sym,side:form.side,lev:form.lev,margin:form.margin}),'primary'),span:2}]);
    R.push('spacer');
    R.push([{v:'Account',cls:'hd',span:10}]);
    R.push([{v:'Equity',cls:'h'},{v:fmt(A.equity,0),cls:'r b '+(A.equity>=A.start?'green':'red'),f:'=cash+SUM(position equity)'},{v:'Cash',cls:'h'},{v:fmt(A.cash,0),cls:'r'},{v:'Dividends received',cls:'h'},{v:'$'+fmt(A.divReceived),cls:'r green'},{v:'Dividends paid',cls:'h'},{v:'$'+fmt(A.divPaid),cls:'r red'},{el:btn('Reset',()=>{if(confirm('Reset to 10,000 practice USDG?'))post('/api/desk/reset',{w:who()})}),span:2}]);
    R.push('spacer');
    R.push([{v:'Open positions',cls:'hd',span:10}]);
    R.push([{v:'Ticker',cls:'hd'},{v:'Side',cls:'hd'},{v:'Lev',cls:'hd r'},{v:'Entry',cls:'hd r'},{v:'Mark',cls:'hd r'},{v:'Liq',cls:'hd r'},{v:'PnL',cls:'hd r'},{v:'Next dividend',cls:'hd r'},{v:'Received',cls:'hd r'},{v:'',cls:'hd'}]);
    if(!A.positions.length)R.push([{v:'no open positions',cls:'muted',span:10}]);
    for(const p of A.positions)R.push([{v:p.sym,cls:'b'},{v:'<span class="chip '+(p.side==='long'?'g':'r')+'">'+p.side+'</span>'},{v:p.lev+'×',cls:'r'},{v:fmt(p.entry),cls:'r'},{v:fmt(p.mark),cls:'r'},{v:fmt(p.liqPx),cls:'r muted'},{v:(p.pnl>=0?'+':'')+fmt(p.pnl),cls:'r '+(p.pnl>=0?'up':'dn'),f:'=(mark−entry)×shares'+(p.side==='short'?'×−1':'')},{v:p.nextDiv?(p.nextDiv.cash>=0?'+':'')+'$'+fmt(p.nextDiv.cash)+' · '+fmtDate(p.nextDiv.ex):'—',cls:'r '+(p.nextDiv&&p.nextDiv.cash>=0?'green':'red'),f:'=shares×dividend'},{v:'$'+fmt(p.divReceived||0),cls:'r'},{el:btn('Close',()=>post('/api/desk/close',{w:who(),id:p.id}))}]);
    R.push('spacer');
    R.push([{v:'Dividend events',cls:'hd',span:5},{v:'Closed',cls:'hd',span:5}]);
    const ev=A.events||[],cl=A.closed||[];const n=Math.max(ev.length,cl.length,1);
    for(let i=0;i<n;i++){const e=ev[i],c=cl[i];R.push([{v:e?fmtDate(e.t):i?'':'none yet',cls:'muted'},{v:e?e.sym:''},{v:e?e.side:''},{v:e?(e.side==='long'?'+':'−')+'$'+fmt(e.cash):'',cls:'r '+(e?(e.side==='long'?'green':'red'):'')},{v:''},{v:c?c.sym+' '+c.side+' '+c.lev+'×':i?'':'nothing closed yet',cls:'muted'},{v:c?fmt(c.entry):'',cls:'r'},{v:c?fmt(c.exit):'',cls:'r'},{v:c?(c.pnl>=0?'+':'')+fmt(c.pnl):'',cls:'r '+(c?(c.pnl>=0?'up':'dn'):'')},{v:c?(c.reason==='liquidated'?'<span class="chip r">liquidated</span>':'closed'):''}])}
    S.render(R);document.getElementById('status').innerHTML='equity <b>'+fmt(A.equity,0)+'</b> · '+A.positions.length+' open · dividends received <b>$'+fmt(A.divReceived)+'</b>';
  }
  async function refresh(){const b=await fetch('/api/board').then(r=>r.json());BOARD=b.feeds;A=await fetch('/api/desk?w='+who()).then(r=>r.json());draw()}
  document.addEventListener('wallet',refresh);refresh();setInterval(refresh,8000);
})();
</script>
</body></html>
